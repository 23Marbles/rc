[package]
name = "rc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.34"
rand = "0.10.3"
russh = { version = "0.64.1", features = ["aws-lc-rs"] }
rust-pty = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
service-manager = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
